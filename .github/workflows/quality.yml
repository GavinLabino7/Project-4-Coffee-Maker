
name: CoffeeMaker Quality Checks

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: CoffeeMaker/pom.xml

      - name: Run JUnit regression tests
        working-directory: ./CoffeeMaker
        run: chmod +x mvnw && ./mvnw test

      - name: Run PIT mutation testing
        working-directory: ./CoffeeMaker
        run: chmod +x mvnw && ./mvnw test-compile org.pitest:pitest-maven:mutationCoverage

      - name: Upload PIT report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pit-report
          path: CoffeeMaker/target/pit-reports/

      # Add PIT mutation testing later

      # Add PIT report artifact upload later

